<!DOCTYPE html>

<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    {% load static %}

    <link rel="stylesheet"
          href="{% static 'css/edit_task.css' %}">

    <title>Bella | Edit Task</title>

</head>

<body>

<div class="add-task-page">

    <!-- HEADER -->

    <header class="page-header">

        <div>
            <h1>📝 Edit Task</h1>
            <p>Update your task details below.</p>
        </div>

        <a href="{% url 'dashboard_views' %}" class="back-btn">
            ← Back to Dashboard
        </a>

    </header>


    <!-- ADD TASK CARD -->

    <div class="task-form-card">

        <form method="POST">

            {% csrf_token %}


            <!-- TASK TITLE -->

            <div class="form-group">

                <label for="title">
                    Task Title
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    value="{{task.title}}"
                    required
                >

            </div>


            <!-- DESCRIPTION -->

            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    rows="5"
                >{{task.description}}</textarea>

            </div>


            <!-- COMPLETED -->

            <div class="completed-option">

                <input
                    type="checkbox"
                    id="completed"
                    name="completed"
                >

                <label for="completed">
                    Mark this task as completed
                </label>

            </div>


            <!-- BUTTONS -->

            <div class="form-actions">

                <button
                    type="submit"
                    name="action"
                    value="save"
                    class="save-btn">
                    Save Task
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
